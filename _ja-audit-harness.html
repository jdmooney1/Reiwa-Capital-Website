<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#ccc;font-family:sans-serif}
.row{display:flex;gap:8px;padding:8px}
.frame-wrap{background:#fff;box-shadow:0 0 0 1px #999}
iframe{border:0;display:block}
label{font-size:11px;padding:4px 8px;display:block;background:#333;color:#fff}
</style></head><body>
<div class="row">
  <div class="frame-wrap"><label id="l1">mobile 390</label><iframe id="f1" width="390" height="1600" src="about:blank"></iframe></div>
  <div class="frame-wrap"><label id="l2">desktop 1440</label><iframe id="f2" width="1440" height="1000" src="about:blank"></iframe></div>
</div>
<script>
window.setPage = function(path){
  document.getElementById('f1').src = path + (path.includes('?') ? '&' : '?') + 'lang=ja';
  document.getElementById('f2').src = path + (path.includes('?') ? '&' : '?') + 'lang=ja';
  document.getElementById('l1').textContent = path + ' — mobile 390';
  document.getElementById('l2').textContent = path + ' — desktop 1440';
};
</script>
</body></html>
